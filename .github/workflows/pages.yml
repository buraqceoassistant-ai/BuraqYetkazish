name: Deploy site to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # публикуется только основная ветка репозитория (в том числе коммит смены пароля с сайта)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          # всё, что service worker кладёт в кэш (SHELL в sw.js), должно попасть на сайт: проверяет tests/deploy.test.mjs
          cp -r index.html driver.html manifest.webmanifest sw.js css js fonts icons img data learn _site/
          # логотипы из бренд-бука — только те, что нужны сайту
          mkdir -p _site/buraq-brand/logo
          cp buraq-brand/logo/*.svg _site/buraq-brand/logo/
          touch _site/.nojekyll
          # новая версия кэша service worker для каждой сборки
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
          # в сайт не должны попасть открытые данные
          if find _site -name '*.xlsx' | grep -q .; then echo "::error::В сайте найден .xlsx"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
